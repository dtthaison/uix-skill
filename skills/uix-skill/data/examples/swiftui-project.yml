# XcodeGen spec. Replace every <Placeholder>. With no custom font, drop `fonts` from sources and the info: block (UIAppFonts). Then run: xcodegen generate
name: <Name>
options:
  bundleIdPrefix: <com.example>
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: <Display Name>
targets:
  <Name>:
    type: application
    platform: iOS
    sources: [Sources, Resources, fonts]
    info:
      path: Sources/Info.plist
      properties:
        UIAppFonts: [<Font-Regular>.ttf, <Font-Medium>.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <com.example>.<name>
