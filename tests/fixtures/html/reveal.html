<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>t</title><style>body{margin:0;font:16px sans-serif;color:#111;background:#fff}.spacer{height:3000px}.reveal{opacity:0}.reveal.in{opacity:1}#late{color:#999}</style></head>
<body><main><h1>Reveal</h1><div class="spacer"></div><section class="reveal"><p id="late">Revealed late</p></section></main>
<script>const io=new IntersectionObserver((es)=>es.forEach((e)=>{if(e.isIntersecting)e.target.classList.add('in')}));document.querySelectorAll('.reveal').forEach((n)=>io.observe(n));</script></body></html>
